name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# One group per pull request, so that a new push cancels the obsolete
# runs, and one group per commit otherwise, so that every commit of
# master is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

        ocaml-compiler:
          - "4.14"
          - "5.4"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Dependencies
        run: opam install --deps-only . --with-test
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune build @runtest
